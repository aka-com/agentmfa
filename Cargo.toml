[workspace]
resolver = "2"
members = ["crates/aka-api", "crates/aka-client", "crates/aka-core", "crates/aka", "crates/aka-sandbox"]
# src-tauri is deliberately NOT a workspace member: it only builds where the
# platform webview toolchain exists (macOS; Linux needs webkit2gtk). The core
# and CLI crates build and test everywhere.
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
aka-api = { path = "crates/aka-api" }
aka-client = { path = "crates/aka-client" }
aka-core = { path = "crates/aka-core" }

async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
zeroize = "1"
base64 = "0.22"
percent-encoding = "2"
dirs = "6"
libc = "0.2"
tempfile = "3"
getrandom = "0.3"
sha2 = "0.10"
hmac = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
tower = "0.5"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures = "0.3"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

# Postgres proxy
postgres-protocol = "0.6"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pki-types = "1"
webpki-roots = "0.26"
md-5 = "0.10"
pbkdf2 = "0.12"
chacha20poly1305 = "0.10"
tokio-postgres = "0.7"

# SSH agent adapter
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519", "rsa"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
signature = "2"

clap = { version = "4", features = ["derive"] }
