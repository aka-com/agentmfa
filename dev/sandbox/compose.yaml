name: aka-sandbox

services:
  fixture:
    image: aka-sandbox-fixture
    build:
      context: ../..
      dockerfile: dev/sandbox/fixture/Dockerfile
    environment:
      SANDBOX_HTTP_TOKEN: aka-test-token
      # The MCP server shares this container and the HTTP port; an MCP
      # connection is an API connection carrying an mcp_path (/mcp).
      SANDBOX_MCP_TOKEN: aka-mcp-test-token
      SANDBOX_CROSS_ORIGIN_URL: http://127.0.0.1:${SANDBOX_WS_PORT:-18081}/credential-sink
    ports:
      # Override any occupied port with SANDBOX_*_PORT environment variables;
      # scripts/sandbox-status.sh reads the same variables and defaults.
      - "127.0.0.1:${SANDBOX_HTTP_PORT:-18080}:8080"
      - "127.0.0.1:${SANDBOX_WS_PORT:-18081}:8080"

  postgres:
    image: postgres:18@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
    environment:
      POSTGRES_USER: aka
      POSTGRES_PASSWORD: aka-test-password
      POSTGRES_DB: aka_sandbox
    ports:
      - "127.0.0.1:${SANDBOX_PG_PORT:-15432}:5432"
    healthcheck:
      # Probe over TCP: first-boot initdb runs a temporary server that only
      # answers on the Unix socket, so a socket probe reports ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U aka -d aka_sandbox"]
      interval: 2s
      timeout: 2s
      retries: 20

  ssh:
    image: lscr.io/linuxserver/openssh-server:latest@sha256:deec9e402eb9a656de1749c3ea93e99478a565cf187ecfb051f8446d93b12483
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      USER_NAME: sandbox
      PUBLIC_KEY_FILE: /keys/client_key.pub
      PASSWORD_ACCESS: "false"
      SUDO_ACCESS: "false"
    volumes:
      # create_host_path: false makes a direct `docker compose up` fail with a
      # clear error instead of silently creating a directory where the key
      # belongs; `npm run sandbox:up` generates the key before composing.
      - type: bind
        source: ./state/ssh/client_key.pub
        target: /keys/client_key.pub
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: ssh_config
        target: /config
    ports:
      - "127.0.0.1:${SANDBOX_SSH_PORT:-12222}:2222"

volumes:
  ssh_config:
