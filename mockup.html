<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentMFA — Interactive Mockup</title>
<!--
  AgentMFA v1 — interactive design mockup.
  Fully self-contained: inline CSS + vanilla JS, zero external requests.
  Open directly from file:// in any modern browser.
  The right pane simulates a real Claude Code terminal session driving the
  broker: boot banner, natural-language user prompts, ● Bash(...) tool calls
  with ⎿ results, and approval waits that resolve in the AgentMFA app on the
  left. Transports (per DESIGN.md §2/§8): the control plane is HTTP over a
  Unix domain socket (broker.sock); only the data planes — the PG proxy and
  the WS bridge — are loopback TCP, on ephemeral OS-assigned ports surfaced
  only in open responses. Fixture session tickets are 128-bit and
  the pair token 256-bit, matching DESIGN.md §8.
-->
<style>
/* ============================== reset / base ============================== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  color: #1d1d1f;
  background: #e7e8ee;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 48px;
}
button { font-family: inherit; }
code, .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }

/* ============================== state switcher (demo chrome) ============================== */
.statebar {
  background: #1c1c22;
  color: #b9bac4;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 16px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  border-bottom: 2px dashed #3a3a44;
}
.statebar .sb-label { color: #6f7079; margin-right: 4px; }
.statebar button {
  background: #2b2b34; color: #d8d9e2; border: 1px solid #3f3f4a;
  border-radius: 5px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  font-family: inherit;
  transition: background .15s ease;
}
.statebar button:hover { background: #3a3a46; }
.statebar button.on { border-color: #4f8ef7; background: #1d2a45; color: #9ec1ff; }

/* ============================== stage layout ============================== */
.stage {
  display: flex; gap: 26px; align-items: flex-start; justify-content: center;
  flex-wrap: wrap;
  padding: 26px 24px 10px;
}

/* ============================== desktop (left pane) ============================== */
.desktop {
  position: relative;
  width: 610px; height: 660px;
  border-radius: 14px; overflow: hidden;
  background:
    radial-gradient(120% 90% at 15% 10%, rgba(255,255,255,.28), rgba(255,255,255,0) 55%),
    linear-gradient(152deg, #7ea7d8 0%, #9a90c6 45%, #d9a89f 100%);
  box-shadow: 0 18px 44px rgba(20,24,50,.28), 0 2px 8px rgba(20,24,50,.16);
  flex: 0 0 auto;
}

/* menu bar */
.menubar {
  height: 28px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px;
  background: rgba(250,250,253,.66);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  font-size: 13px;
  user-select: none;
  position: relative; z-index: 5;
  border-bottom: 1px solid rgba(0,0,0,.06);
}
.mb-left { display: flex; align-items: center; gap: 16px; color: #2b2b2e; }
.mb-left .apple { display: inline-flex; align-items: center; }
.mb-left b { font-weight: 700; }
.mb-left span { opacity: .85; }
.mb-right { display: flex; align-items: center; gap: 10px; }
#menu-clock { width: 138px; text-align: right; font-size: 12.5px; color: #2b2b2e; }
.tray {
  position: relative;
  width: 26px; height: 22px;
  border: none; background: transparent; border-radius: 5px;
  font-size: 14px; line-height: 22px; cursor: pointer;
  transition: background .15s ease;
}
.tray:hover { background: rgba(0,0,0,.10); }
.tray.active { background: rgba(0,0,0,.16); }
.badge-dot {
  position: absolute; top: -3px; right: -4px;
  min-width: 15px; height: 15px; padding: 0 3px;
  background: #ff3b30; color: #fff;
  border-radius: 8px; font-size: 9.5px; font-weight: 700; line-height: 15px;
  text-align: center;
  box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.badge-dot.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(255,59,48,.55); }
  50%      { transform: scale(1.18); box-shadow: 0 0 0 6px rgba(255,59,48,0); }
}

/* hint on empty desktop */
.desk-hint {
  position: absolute; top: 45%; left: 0; right: 0;
  text-align: center; color: rgba(255,255,255,.85);
  font-size: 13px; text-shadow: 0 1px 4px rgba(0,0,40,.25);
  pointer-events: none;
}
.desk-hint .big { font-size: 34px; display: block; margin-bottom: 8px; }

/* ============================== tray dropdown window ============================== */
.dropdown {
  position: absolute; top: 36px; right: 16px;
  width: 430px; height: 520px;
  display: flex; flex-direction: column;
  background: rgba(246,246,249,.88);
  backdrop-filter: blur(24px) saturate(170%);
  -webkit-backdrop-filter: blur(24px) saturate(170%);
  border: 1px solid rgba(255,255,255,.55);
  border-radius: 13px;
  box-shadow: 0 16px 40px rgba(15,20,45,.32), 0 2px 10px rgba(15,20,45,.18);
  opacity: 0; transform: scale(.96) translateY(-6px); transform-origin: top right;
  pointer-events: none;
  transition: opacity .15s ease, transform .15s ease;
  z-index: 4;
}
.dropdown.open { opacity: 1; transform: none; pointer-events: auto; }
.dd-arrow {
  position: absolute; top: -6px; right: 156px;
  width: 12px; height: 12px;
  background: rgba(246,246,249,.95);
  border-left: 1px solid rgba(255,255,255,.55);
  border-top: 1px solid rgba(255,255,255,.55);
  transform: rotate(45deg);
}
.dd-head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px 10px;
}
.dd-appicon {
  width: 34px; height: 34px; border-radius: 8px;
  background: linear-gradient(160deg, #4a4a52, #26262c);
  color: #fff; font-size: 17px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), 0 1px 3px rgba(0,0,0,.25);
}
.dd-title { font-size: 14.5px; font-weight: 700; }
.dd-sub { font-size: 12px; color: #7a7a82; margin-top: 1px; display: flex; align-items: center; gap: 5px; }
.dd-sub .dot { width: 7px; height: 7px; border-radius: 50%; background: #30c94e; box-shadow: 0 0 4px rgba(48,201,78,.7); display: inline-block; }

/* segmented control */
.seg {
  display: flex; gap: 2px;
  margin: 0 14px 10px;
  background: rgba(0,0,0,.065);
  border-radius: 8px; padding: 2px;
}
.seg-btn {
  flex: 1; border: none; background: transparent;
  padding: 4px 0; font-size: 12.5px; color: #48484e;
  border-radius: 6px; cursor: pointer;
  transition: background .15s ease, box-shadow .15s ease;
}
.seg-btn.on {
  background: #fff; color: #111;
  box-shadow: 0 1px 3px rgba(0,0,0,.15);
  font-weight: 600;
}
.seg.in-form { margin: 0; }
.seg.in-form .seg-btn { padding: 5px 0; }
.seg-count {
  display: inline-block; min-width: 15px; padding: 0 3px;
  background: rgba(0,0,0,.12); border-radius: 8px;
  font-size: 10px; line-height: 15px;
}

/* in-app pending-approvals indicator (DESIGN.md §9: tray badge + in-app indicator) */
.pending-banner {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin: 0 14px 8px; padding: 6px 10px;
  background: rgba(255,190,50,.16); border: 1px solid rgba(200,140,20,.3);
  border-radius: 8px;
  font-size: 12px; font-weight: 600; color: #7a5410;
}

/* multi-secret rows in the Add connection dialog */
.sec-multi { display: flex; gap: 6px; align-items: center; }
.sec-multi select { flex: 1; }

/* ============================== settings sheet ============================== */
.set-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 2px;
  border-bottom: 1px solid rgba(0,0,0,.06);
}
.set-txt { flex: 1; }
.set-txt .st-title { font-size: 13px; font-weight: 600; }
.set-txt .st-sub { font-size: 11.5px; color: #82828a; line-height: 1.45; margin-top: 2px; }
.switch {
  position: relative; flex: 0 0 auto; margin-top: 2px;
  width: 36px; height: 22px; border-radius: 11px;
  background: rgba(0,0,0,.22); border: none; cursor: pointer;
  transition: background .18s ease;
}
.switch.on { background: #34c759; }
.switch::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25);
  transition: left .18s ease;
}
.switch.on::after { left: 16px; }
/* toggling sync migrates every Keychain item, so it is always confirmed before applying (§3) */
.sync-confirm {
  margin: 10px 0 4px; padding: 10px 12px;
  background: rgba(255,190,50,.15); border: 1px solid rgba(200,140,20,.35);
  border-radius: 9px;
  font-size: 12px; line-height: 1.5; color: #7a5410;
}
.sync-confirm .sc-head { display: block; font-weight: 700; margin-bottom: 4px; }
.set-collapse { border-bottom: 1px solid rgba(0,0,0,.06); padding: 8px 2px; }
.set-collapse summary { cursor: pointer; font-size: 13px; font-weight: 600; list-style-position: inside; }
.set-panel { padding: 9px 0 2px; }
.set-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

/* persistent band of global broker state (paired agents + live sessions) above the tabs */
.dd-global {
  padding: 0 14px; margin-bottom: 8px;
  max-height: 172px; overflow-y: auto;
  border-bottom: 1px solid rgba(0,0,0,.08);
}
.dd-content { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 14px 12px; position: relative; }
.dd-content::-webkit-scrollbar { width: 8px; }
.dd-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); border-radius: 4px; }

/* ============================== secrets table ============================== */
.sec-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.sec-table td {
  padding: 8px 6px;
  border-bottom: 1px solid rgba(0,0,0,.06);
  vertical-align: middle;
}
.s-cell { display: flex; align-items: center; gap: 9px; }
.s-name {
  font-weight: 600; font-size: 13px;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
.s-sub {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 11px; color: #82828a; margin-top: 2px;
  max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.c-name { font-weight: 600; font-size: 13.5px; }
.key-chip {
  display: inline-block; padding: 2px 8px; border-radius: 6px;
  background: rgba(0,0,0,.06); color: #4c4c53; white-space: nowrap;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px;
  max-width: 145px; overflow: hidden; text-overflow: ellipsis; vertical-align: middle;
}
.allow-chip {
  display: inline-flex; align-items: center; gap: 5px;
  margin-top: 4px; padding: 2px 8px; border-radius: 8px;
  background: rgba(255,190,50,.18); border: 1px solid rgba(200,140,20,.28);
  color: #7a5410; font-size: 11px; font-weight: 600;
}
.allow-chip button {
  border: none; background: transparent; cursor: pointer;
  color: inherit; font-size: 12px; line-height: 1; padding: 0;
}
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 9px;
  font-size: 11px; font-weight: 600; white-space: nowrap;
}
.b-api { background: #dcecff; color: #0b62d6; }
.b-pg  { background: #dfeef4; color: #2b6a8f; }
.b-ssh { background: #e2f3e6; color: #2c7a45; }
.b-ws  { background: #efe4fb; color: #7d3fc0; }
.val { white-space: nowrap; text-align: right; }
.val code { font-size: 12px; letter-spacing: .04em; color: #3c3c42; }
.val-wrap { display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; }
/* ghost copy button — reserved in layout (no hover shift), fades in on value hover */
.ghost-copy {
  display: inline-flex; align-items: center; gap: 4px;
  opacity: 0; transition: opacity .14s ease;
  border: 1px solid rgba(0,0,0,.14); background: rgba(255,255,255,.92);
  color: #3c3c42; border-radius: 6px; padding: 2px 7px;
  font-size: 11px; line-height: 1; cursor: pointer;
  box-shadow: 0 1px 1px rgba(0,0,0,.04);
}
.ghost-copy svg { width: 12px; height: 12px; }
.val-wrap:hover .ghost-copy, .ghost-copy:focus-visible { opacity: 1; }
.val code.copied { color: #1a8f3c; font-weight: 600; letter-spacing: normal; animation: copied-pop .22s ease; }
@keyframes copied-pop { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }
.icon-btn {
  border: none; background: transparent; cursor: pointer;
  color: #8b8b92; padding: 3px; border-radius: 5px; vertical-align: middle;
  line-height: 0;
  transition: background .15s ease, color .15s ease;
}
.icon-btn:hover { background: rgba(0,0,0,.08); color: #333; }
.rowdel { text-align: right; }
.confirm-row td {
  background: rgba(255,59,48,.08);
  border-radius: 6px;
  height: 48px;
  padding: 0 6px;
  font-size: 12px;
}
.confirm-row span { margin-right: 8px; }
.confirm-inline { min-height: 48px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.confirm-inline span { flex: 1; min-width: 0; margin-right: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-footer { padding: 10px 14px 12px; }
.btn.block { display: block; width: 100%; text-align: center; padding: 7px 13px; }

/* empty state */
.empty { text-align: center; padding: 42px 26px; }
.empty-ico {
  font-size: 34px; width: 66px; height: 66px; line-height: 66px;
  margin: 0 auto 12px; border-radius: 16px;
  background: rgba(0,0,0,.05); border: 1px dashed rgba(0,0,0,.15);
}
.empty h3 { font-size: 15px; margin-bottom: 6px; }
.empty p { font-size: 12.5px; color: #7a7a82; line-height: 1.5; margin-bottom: 16px; }

/* ============================== main window (desktop mode) ============================== */
/* The same frontend in regular-window chrome (DESIGN.md §2): sidebar
   (brand + status, nav, Settings) beside a roomier content pane. */
.desktop-win {
  position: absolute; top: 50px; left: 24px; right: 24px; bottom: 26px;
  display: none; flex-direction: column;
  background: rgba(246,246,249,.94);
  backdrop-filter: blur(24px) saturate(170%);
  -webkit-backdrop-filter: blur(24px) saturate(170%);
  border: 1px solid rgba(255,255,255,.55);
  border-radius: 12px;
  box-shadow: 0 18px 44px rgba(15,20,45,.32), 0 2px 10px rgba(15,20,45,.18);
  overflow: hidden;
  z-index: 3;
}
.desktop-win.show { display: flex; }
.dw-titlebar {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  background: rgba(255,255,255,.5);
  border-bottom: 1px solid rgba(0,0,0,.08);
  user-select: none;
}
.dw-titlebar .dw-title { flex: 1; text-align: center; font-size: 13px; font-weight: 600; color: #3a3a40; }
/* balances the traffic-light dots so the title stays truly centered */
.tl-spacer { flex: 0 0 auto; width: 50px; }
.dw-body { flex: 1; display: flex; min-height: 0; }

/* settings popover (gear, sidebar bottom) */
.dw-settings { position: relative; }
.gear-btn { justify-content: center; }
.settings-menu {
  position: absolute; left: 0; right: 0; bottom: calc(100% + 4px); z-index: 12;
  display: flex; flex-direction: column; gap: 2px; padding: 4px;
  background: #fbfbfd; border: 1px solid rgba(0,0,0,.12); border-radius: 9px;
  box-shadow: 0 10px 28px rgba(10,15,40,.22);
}
.menu-item {
  display: flex; align-items: center; gap: 8px;
  border: none; background: transparent; cursor: pointer;
  text-align: left; padding: 7px 9px; border-radius: 6px;
  font-size: 12.5px; color: #2c2c30;
  transition: background .15s ease;
}
.menu-item:hover { background: rgba(0,0,0,.07); }
.menu-item svg { flex: 0 0 auto; color: #8b8b92; }
.dw-side {
  flex: 0 0 168px; display: flex; flex-direction: column;
  padding: 12px 10px 10px;
  border-right: 1px solid rgba(0,0,0,.08);
  background: rgba(0,0,0,.025);
}
.dw-brand { display: flex; align-items: center; gap: 9px; padding: 2px 4px 12px; }
.dw-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 7px;
  border: none; background: transparent; cursor: pointer;
  text-align: left; padding: 6px 9px; border-radius: 7px;
  font-size: 13px; color: #3c3c42;
  transition: background .15s ease;
}
.nav-item:hover { background: rgba(0,0,0,.06); }
.nav-item.on { background: rgba(10,124,255,.12); color: #0a63d0; font-weight: 600; }
.dw-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.dw-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px 8px;
}
.dw-head h2 { font-size: 16px; }
.dw-content { flex: 1; overflow-y: auto; padding: 0 16px 14px; }
.dw-content::-webkit-scrollbar { width: 8px; }
.dw-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); border-radius: 4px; }
.dw-main .pending-banner { margin: 0 16px 8px; }
.dw-main .dd-global { margin: 0 2px 8px; }
.pane-footer { padding: 8px 16px 12px; border-top: 1px solid rgba(0,0,0,.06); }
.pane-add {
  width: 100%; border: none; background: transparent; color: #0a7cff;
  border-radius: 7px; padding: 8px 10px; font-size: 13px; cursor: pointer;
}
.pane-add:hover { background: rgba(10,124,255,.08); }

/* ============================== buttons ============================== */
.btn {
  border: 1px solid rgba(0,0,0,.14); background: #fff; color: #1d1d1f;
  border-radius: 7px; padding: 5px 13px; font-size: 12.5px; cursor: pointer;
  box-shadow: 0 1px 1px rgba(0,0,0,.05);
  transition: background .15s ease;
}
.btn:hover { background: #f2f2f5; }
.btn.primary { background: #0a7cff; border-color: #0a7cff; color: #fff; font-weight: 600; }
.btn.primary:hover { background: #0868da; }
.btn.danger { background: #ff3b30; border-color: #ff3b30; color: #fff; font-weight: 600; }
.btn.danger:hover { background: #e0281e; }
.btn.deny { color: #d70015; font-weight: 600; }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; color: #0a7cff; }
.btn.ghost:hover { background: rgba(10,124,255,.08); }
.btn.sm { padding: 3px 9px; font-size: 11.5px; }

/* ============================== activity tab ============================== */
/* Console.app-style rows: a mono timestamp gutter, then the entry's emoji,
   then the two-line anatomy — a plain-text primary line and a smaller,
   fainter detail line under it. */
.act-list { display: flex; flex-direction: column; }
.act-row { display: flex; gap: 9px; align-items: flex-start; padding: 4.5px 2px; font-size: 12px; }
.act-gutter {
  flex: 0 0 56px; font-size: 11px; color: #92929a;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  padding-top: 2px;
}
.act-ico { flex: 0 0 auto; font-size: 13px; line-height: 1.4; }
.act-txt { flex: 1; line-height: 1.4; color: #2c2c30; word-break: break-word; }
.act-detail { font-size: 11px; color: #a4a4ac; line-height: 1.4; margin-top: 2px; }
.muted-note { font-size: 12.5px; color: #82828a; text-align: center; padding: 30px 20px; line-height: 1.5; }

/* ---- connections (card grid, after TablePlus launchers / Keybase device
   cards): one connection = one object with everything inside its border ---- */
.conn-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 9px; padding-top: 4px; }
.conn-card {
  background: rgba(255,255,255,.72); border: 1px solid rgba(0,0,0,.09);
  border-radius: 11px; padding: 10px 11px 8px;
  box-shadow: 0 1px 3px rgba(20,24,50,.06);
  display: flex; flex-direction: column; gap: 6px;
}
.cc-top { display: flex; align-items: center; gap: 6px; }
.cc-top .c-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.cc-target {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 10.5px; color: #8b8b92;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cc-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.cc-chips .key-chip { max-width: 100%; }
.cc-chips .allow-chip { margin-top: 0; }
.cc-live { flex: 0 0 auto; font-size: 10.5px; color: #177a35; font-weight: 600; }
.cc-foot { display: flex; justify-content: flex-end; gap: 2px; margin-top: auto; padding-top: 4px; border-top: 1px solid rgba(0,0,0,.06); }

/* live WS/PG sessions + paired agents (the global band above the tabs) */
.live-head { font-size: 11.5px; font-weight: 600; color: #82828a; padding: 9px 2px 4px; }
.live-row {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 2px;
  border-bottom: 1px solid rgba(0,0,0,.06);
}
.live-row .live-txt { flex: 1; min-width: 0; }
.live-row .s-sub { max-width: 230px; }

/* auto-allow rule preview (approval sheet) */
.rule-line { font-size: 13px; margin: 2px 0 8px; }
.rule-line code {
  background: rgba(0,0,0,.06); padding: 1px 6px; border-radius: 5px; font-size: 12px;
}
.rule-note { font-size: 11.5px; color: #82828a; margin-bottom: 8px; line-height: 1.4; }

/* ---- Claude Code transcript anatomy ----
   .t-shell  the shell line that launched `claude`
   .t-boot   the boot banner (logo block + version / model / cwd)
   .t-user   a submitted user prompt: `> …` in the muted secondary color
   .t-claude assistant prose: `●` bullet + normal text

   .t-res    tool output: `  ⎿  …`, dim, with optional "… +N lines" tail   */
.t-shell { color: #8b949e; }

.t-user  { color: #8b949e; margin-top: 12px; padding-left: 14px; text-indent: -14px; }

.t-tool b { color: #e6edf3; font-weight: 700; }

<script>
'use strict';

/* ============================================================
   helpers
   ============================================================ */
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escAttr(s) {
  return esc(s).replace(/"/g, '&quot;');
}
function nowTime() {
  return new Date().toTimeString().slice(0, 8);
}
function timeAgo(min) {
  return new Date(Date.now() - min * 60000).toTimeString().slice(0, 8);
}

/* ============================================================
   constants / fixtures

      (a.sub ? '<div class="act-detail">' + esc(a.sub) + '</div>' : '') + '</span></div>';
  }).join('') + '</div>';
}

// Edit secret sheet (DESIGN.md §9): the value field is write-only. The

function addConnSheetHTML() {
  var t = store.connType;
  var d = store.draft;
  var editing = store.editConn ? findConn(store.editConn) : null;
  // one connection can compose several secrets (DESIGN.md §3 — e.g. basic-auth user + password)
  var chosen = (d.connSecrets && d.connSecrets.length)
    ? d.connSecrets.slice()
    : [(store.secrets[0] && store.secrets[0].name) || '__new__'];
  // multi-secret composition is API-only; pg/ssh/ws bind exactly one secret (DESIGN.md §9)
  if (t !== 'api') chosen = chosen.slice(0, 1);
  store.connNewSecret = chosen[0] === '__new__';
  var fields = '';
  fields += '<div class="f-row"><label>Name</label>' +
    '<input id="f-cname" placeholder="e.g. github" value="' + escAttr(d.connName || '') + '"></div>';
  // a connection's type is fixed after creation (DESIGN.md §9) — inert in edit mode
  function typeBtn(val, label) {
    if (editing) {
      return '<button type="button" class="seg-btn' + (t === val ? ' on' : '') + '" disabled' +
        (t === val ? '' : ' style="opacity:.35"') + '>' + label + '</button>';
    }
    return '<button type="button" class="seg-btn' + (t === val ? ' on' : '') + '" data-act="conn-type" data-type="' + val + '">' + label + '</button>';
  }
  fields += '<div class="f-row"><label>Type' + (editing ? ' — fixed after creation' : '') + '</label><div class="seg in-form">' +
    typeBtn('api', 'API key') + typeBtn('pg', 'Postgres') + typeBtn('ssh', 'SSH') + typeBtn('ws', 'WebSocket') +
    '</div></div>';
  if (t === 'api') {
    fields += '<div class="f-row"><label>Host</label><input id="f-host" placeholder="api.github.com" value="' + escAttr(d.host || '') + '"></div>';
  } else if (t === 'ssh') {
    fields += '<div class="f-2col">' +
      '<div class="f-row"><label>Host</label><input id="f-host" placeholder="prod.example.com" value="' + escAttr(d.host || '') + '"></div>' +
      '<div class="f-row" style="flex:0 0 90px"><label>Port</label><input id="f-port" inputmode="numeric" value="' + escAttr(d.port || '22') + '"></div></div>';
    fields += '<div class="f-row"><label>User</label><input id="f-user" placeholder="deploy" value="' + escAttr(d.user || '') + '"></div>';
  } else if (t === 'pg') {
    var sslmode = d.sslmode || 'require';
    var sslOpts = [
      ['disable', 'Disable'],
      ['prefer', 'Prefer (TLS optional)'],
      ['require', 'Require TLS (no certificate verification)'],
      ['verify-ca', 'Verify CA only (no hostname verification)'],
      ['verify-full', 'Verify full']
    ].map(function (option) {
      return '<option value="' + option[0] + '"' + (sslmode === option[0] ? ' selected' : '') + '>' + option[1] + '</option>';
    }).join('');
    fields += '<div class="f-2col">' +
      '<div class="f-row"><label>Host</label><input id="f-host" placeholder="db.internal.example.com" value="' + escAttr(d.host || '') + '"></div>' +
      '<div class="f-row" style="flex:0 0 90px"><label>Port</label><input id="f-port" inputmode="numeric" value="' + escAttr(d.port || '5432') + '"></div></div>';
    fields += '<div class="f-row"><label>Database</label><input id="f-db" placeholder="app_production" value="' + escAttr(d.db || '') + '"></div>';
    fields += '<div class="f-row"><label>User</label><input id="f-user" placeholder="app" value="' + escAttr(d.user || '') + '"></div>';
    fields += '<div class="f-row"><label>TLS mode</label><select id="f-sslmode">' + sslOpts + '</select></div>';
  } else {
    fields += '<div class="f-row"><label>URL</label><input id="f-url" placeholder="wss://stream.example.com/feed" value="' + escAttr(d.url || '') + '"></div>';
  }
  var secretLabel = t === 'pg' ? 'Password secret' : t === 'ssh' ? 'Private key secret' : t === 'ws' ? 'Token secret' : 'Secret';
  chosen.forEach(function (sel, i) {
    var opts = store.secrets.map(function (s) {
      return '<option value="' + escAttr(s.name) + '"' + (sel === s.name ? ' selected' : '') + '>' + esc(s.name) + '</option>';
    }).join('');
    if (i === 0) opts += '<option value="__new__"' + (sel === '__new__' ? ' selected' : '') + '>＋ New secret…</option>';
    var row = '<select id="c-secret-' + i + '">' + opts + '</select>';
    if (i > 0) {
      row += '<button type="button" class="icon-btn" title="Remove secret" data-act="conn-secret-remove" data-idx="' + i + '">✕</button>';
    }
    fields += '<div class="f-row"><label>' + (i === 0 ? secretLabel : 'Additional secret') + '</label>' +
      '<div class="sec-multi">' + row + '</div></div>';
  });
  if (store.connNewSecret) {
    fields += '<div class="f-2col">' +
      '<div class="f-row"><label>New secret name</label><input id="c-newname" placeholder="e.g. STRIPE_API_KEY" value="' + escAttr(d.newName || '') + '"></div>' +
      '<div class="f-row"><label>Value</label><input id="c-newvalue" type="password" placeholder="Your secret (saved in Keychain)" value="' + escAttr(d.newValue || '') + '"></div></div>';
  }
  // composing multiple secrets is only meaningful for an API injection template
  if (t === 'api' && store.secrets.length) {
    fields += '<div class="f-row"><button type="button" class="btn ghost sm" data-act="conn-secret-add">＋ Add another secret</button></div>';
  }
  // pg/ws session tickets can be multi-connect within their 60 s window (DESIGN.md §4.2/§4.3).
  // SSH agent sockets always allow multiple signing operations, so there is no toggle.
  if (t !== 'api' && t !== 'ssh') {
    var multiOn = d.connMulti !== false;   // default checked
    fields += '<div class="f-row"><label style="display:flex;align-items:center;gap:7px;cursor:pointer">' +
      '<input type="checkbox" id="c-multi"' + (multiOn ? ' checked' : '') + ' style="width:auto">' +
      '<span>Allow multiple client connections per approval</span></label>' +
      '<div class="rule-note" style="margin:4px 0 0">Pools and reconnecting clients may redeem the session ticket any number of times within its 60 s window — all under the one approval, up to 60 concurrent sessions.</div></div>';
  }
  if (t === 'api') {
    var refs = chosen.map(function (n) { return n === '__new__' ? (d.newName || 'NEW_SECRET') : n; });
    var defTpl = refs.length > 1
      ? 'Authorization: Basic {{base64(' + refs.join(' ":" ') + ')}}'
      : 'Authorization: Bearer {{' + refs[0] + '}}';
    var tpl = (d.templateDirty && d.template != null) ? d.template : defTpl;
    fields += '<div class="f-row"><label>Injection template</label>' +
      '<input id="c-template" value="' + escAttr(tpl) + '"></div>';
  }
  // a rule was granted for a destination — warn that changing the target drops it (§9)
  if (editing && store.rules.filter(function (r) { return r.connectionId === editing.id; }).length) {
    fields += '<div class="rule-note">⚡ Changing the target removes this connection’s auto-allow rules — a rule granted for one destination must not silently cover another.</div>';
  }
  return '<div class="sheet-backdrop" data-act="add-conn-cancel"></div>' +
    '<div class="sheet"><h3>' + (editing ? 'Edit connection' : 'Add connection') + '</h3>' + fields +
    '<div class="sheet-actions">' +
    '<button class="btn" data-act="add-conn-cancel">Cancel</button>' +
    '<button class="btn primary" data-act="add-conn-save">Save</button></div>' +
    '</div>';
}

// Settings (DESIGN.md §9): Keychain sync, re-auth-on-read, and advanced

  var s = store.settings;

  var syncRow = '<div class="set-row"><div class="set-txt">' +
    '<div class="st-title">Sync secrets via iCloud Keychain</div>' +
    '<div class="st-sub">Allows secrets to sync to your other devices.</div></div>' +
    '<button class="switch' + (s.sync ? ' on' : '') + '" role="switch" aria-checked="' + s.sync + '" title="Sync secrets via iCloud Keychain" data-act="toggle-sync"></button></div>';
  var confirm = '';
  if (store.syncConfirm) {
    var turningOn = store.syncConfirm === 'on';
    var dropsReauth = turningOn && s.reauth;
    var head = turningOn ? 'Turn on iCloud Keychain sync?' : 'Turn off iCloud Keychain sync?';
    var body = 'Every secret is rewritten in the Keychain (read → delete → re-create) as ' +
      (turningOn
        ? 'a synchronizable item that rides iCloud Keychain to your other Macs.'
        : 'a this-device-only item. iCloud propagates the deletion, so the synced copies are removed from your other Macs — after this, the secrets exist only on this Mac.');
    var extra = dropsReauth
      ? ' Synced items can’t carry a per-item OS authentication rule, so the re-authentication requirement is removed and secrets are downgraded to “accessible when unlocked”.'

    confirm = '<div class="sync-confirm"><span class="sc-head">' + (dropsReauth ? '⚠ ' : '') + head + '</span>' +
      body + extra +
      '<div style="margin-top:8px; display:flex; gap:8px; justify-content:flex-end">' +
      '<button class="btn sm" data-act="sync-confirm-no">Cancel</button>' +
      '<button class="btn sm ' + (dropsReauth ? 'danger' : 'primary') + '" data-act="sync-confirm-yes">' +
      (dropsReauth ? 'Remove re-auth &amp; turn on sync' : turningOn ? 'Turn on sync' : 'Turn off sync') +
      '</button></div></div>';
  }
  var reauthRow = '';
  if (!s.sync) {
    reauthRow = '<div class="set-row"><div class="set-txt">' +
      '<div class="st-title">Require OS authentication to read secrets</div>' +
      '<div class="st-sub">Re-authenticate each time a secret value is about to be used. Only available while iCloud sync is off.</div></div>' +
      '<button class="switch' + (s.reauth ? ' on' : '') + '" role="switch" aria-checked="' + s.reauth + '" title="Require OS authentication to read secrets" data-act="toggle-reauth"></button></div>';
  }

    '<summary>Postgres TLS</summary>' +
    '<div class="set-panel">' +
    '<div class="f-row"><label>Trusted CA bundle path</label>' +
    '<input id="f-pg-ca-bundle" placeholder="/path/to/ca-bundle.pem" value="' + escAttr(caPath) + '"></div>' +
    '<div class="rule-note">PEM certificates trusted for Postgres verify-ca and verify-full.</div>' +
    '<div class="set-actions"><button class="btn sm" data-act="clear-pg-ca-bundle">Clear</button>' +
    '<button class="btn sm primary" data-act="save-pg-ca-bundle">Save</button></div>' +
    '</div></details>';
  return '<div class="sheet-backdrop" data-act="settings-close"></div>' +
    '<div class="sheet"><h3>Settings</h3>' + syncRow + confirm + reauthRow + pgTls +
    '<div class="sheet-actions"><button class="btn primary" data-act="settings-close">Done</button></div>' +
    '</div>';

// A + B: an HTTP request's headers/body, collapsed by default but auto-expanded
// for mutating methods (POST/PUT/PATCH/DELETE) — a human approving a write should
// see what is being sent. The injected credential is added by the broker and is
// deliberately never shown here (only the agent-supplied headers are).
function isMutating(method) {
  return /^(POST|PUT|PATCH|DELETE)$/i.test(method || 'GET');
}
function requestDetailHTML(req) {
  if (req.kind !== 'http') return '';
  var mut = isMutating(req.method);
  var shown = store.reqDetailOpen === null ? mut : store.reqDetailOpen;
  var head = '<div class="req-detail-head">' +
    '<button class="btn ghost sm" data-act="toggle-req-detail">' + (shown ? '▾' : '▸') +
    ' Request payload' + (mut ? '<span class="mut-tag">' + esc(req.method) + '</span>' : '') +
    '</button></div>';
  if (!shown) return head;
  var keys = req.reqHeaders ? Object.keys(req.reqHeaders) : [];
  var hdrs = keys.length
    ? keys.map(function (k) {
        return '<div class="rd-line"><span class="rd-k">' + esc(k) + ':</span> ' + esc(String(req.reqHeaders[k])) + '</div>';
      }).join('')
    : '<div class="rd-empty">none</div>';
  var bodyBlock;
  if (req.reqBody == null) {
    bodyBlock = '<div class="rd-empty">none</div>';
  } else {
    var raw = typeof req.reqBody === 'string' ? req.reqBody : JSON.stringify(req.reqBody, null, 2);
    var CAP = 1200;                                 // size-capped like the real 150 MB request cap (DESIGN.md §4.1)
    var trunc = raw.length > CAP;
    bodyBlock = '<pre class="rd-body">' + esc(trunc ? raw.slice(0, CAP) : raw) +
      (trunc ? '\n… +' + (raw.length - CAP) + ' bytes not shown' : '') + '</pre>';
  }
  return head + '<div class="req-detail">' +
    '<div class="rd-sub">Agent headers <span class="rd-note">— the broker adds the credential header, not shown</span></div>' + hdrs +
    '<div class="rd-sub">Body</div>' + bodyBlock +
    '</div>';
}

function approvalWindowHTML() {
  var req = store.queue[0];
  var conn = req.connection ? findConn(req.connection) : null;
  var t = conn ? TYPES[conn.type] : null;
  var connCell = conn
    ? (t ? '<span class="badge ' + t.cls + '">' + t.label + '</span> ' : '') + '<b>' + esc(conn.name) + '</b>'
    : '';
  var connectionRow = conn
    ? '<div class="ap-row"><span>Connection</span><span>' + connCell + '</span></div>'
    : '';
  var targetRow = conn
    ? '<div class="ap-row"><span>Target</span><code>' + esc(connTarget(conn)) + '</code></div>'
    : '';
  // pairing under a name that already holds standing rules inherits them —
  // DESIGN.md §6 requires a loud disclosure of exactly what is inherited
  var inherit = '';
  if (req.kind === 'pair') {
    var inherited = store.rules.filter(function (r) { return r.agent === req.agent; });
    if (inherited.length) {
      var revoked = store.revokeInheritedRules;
      inherit = '<div class="inherit-warn">' +
        '<span class="iw-head">⚠ This pairing inherits permissions</span>' +
        '<div class="inherit-grants' + (revoked ? ' revoked' : '') + '">Approving this pairing grants access to these previously-authorized connections:' +
        '<ul>' + inherited.map(function (r) {
          // rules die with their connection (§7), so this always resolves; guard anyway
          var c = findConnById(r.connectionId);
          var label = c
            ? c.name + ' (' + TYPES[c.type].label.toLowerCase() + ' · ' + connTarget(c) + ')'
            : '(deleted connection)';
          return '<li><code>' + esc(label) + '</code></li>';
        }).join('') + '</ul></div>' +
        '<label class="inherit-revoke"><input type="checkbox" data-act="toggle-inherited-revoke"' + (revoked ? ' checked' : '') + '> Revoke prior standing permissions on approval</label></div>';
    }
  }
  var always = '';
  if (req.kind !== 'pair') {
    var alwaysBtn = '<button class="btn ghost sm" data-act="toggle-always">Always allow…</button>';
    var alwaysBox = store.alwaysOpen
      ? '<div class="always-box">' +
        '<div class="f-row"><label>Auto-allow rule <span class="stub-badge">policy engine v1 stub</span></label>' +
        '<div class="rule-line"><code>' + esc(req.agent) + '</code> → <code>' + esc(req.connection) + '</code></div>' +
        '<div class="rule-note">Future requests from this agent on this connection are approved automatically. Remove it anytime from the Connections tab.</div></div>' +
        '<button class="btn primary sm" data-act="save-rule">Save rule &amp; allow</button>' +
        '</div>'
      : '';
    always = { btn: alwaysBtn, box: alwaysBox };
  }
  return '<div class="ap-head"><div class="ap-icon">🔐</div>' +
    '<div><div class="ap-title">Approval required</div></div></div>' +
    '<div class="ap-rows">' +
    '<div class="ap-row"><span>Agent</span><b>' + esc(req.agent) + '</b></div>' +
    (req.kind === 'pair'
      ? '<div class="ap-row"><span>Identity</span><code title="The issued token is pinned to this code-signing identity">' +
        esc(req.identity || 'unsigned — no pinned identity') + '</code></div>'
      : '') +
    connectionRow +
    targetRow +
    '<div class="ap-row"><span>Action</span><code>' + esc(req.action) + '</code></div>' +
    ((req.kind === 'pg' || req.kind === 'ws') && conn && conn.multi
      ? '<div class="ap-row"><span>Scope</span><span>All connects within the 60 s ticket window · up to 60 sessions</span></div>'
      : '') +
    '<div class="ap-row"><span>Approve within</span><span><span class="ap-countdown" id="ap-countdown">' +
      fmtRemaining(req.deadline ? req.deadline - Date.now() : 0) + '</span></span></div>' +
    '</div>' +
    requestDetailHTML(req) +
    inherit +
    '<div class="ap-buttons">' +
    '<button class="btn deny" data-act="decide-deny">Deny</button>' +
    (always ? always.btn : '') +
    '<span class="spacer"></span>' +
    '<button class="btn primary" data-act="decide-allow">' +
    (req.kind === 'pair' ? 'Approve pairing' : 'Allow once') + '</button>' +
    '</div>' +
    (always ? always.box : '') +
    (store.queue.length > 1
      ? '<div class="aw-queue">' + (store.queue.length - 1) + ' more pending</div>'
      : '');
}

/* ============================================================
   native OS confirmation (simulated LocalAuthentication, §8)
   ============================================================ */
// High-consequence actions route through here: the webview requests them,
// but only the core-owned native sheet can complete them.
function requireOSConfirm(reason, onConfirm, req) {
  store.osPrompt = { reason: reason, onConfirm: onConfirm, req: req || null };

/* ============================================================
   approval flow
   ============================================================ */
var notifTimer = null;
function doorbell(req) {
  store.notifFor = req;
  if (notifTimer) clearTimeout(notifTimer);
  notifTimer = setTimeout(function () {
    store.notifFor = null;             // the banner is advisory; the window stays
    renderAppSafe();
  }, 4200);
}
// every Prompt auto-raises the always-on-top window and rings the doorbell
function enqueue(req) {
  stampReq(req);
  store.queue.push(req);
  store.approvalOpen = true;
  doorbell(req);
  renderAppSafe();
}

/* ---- approval timeout (DESIGN.md §6: hard 120 s, then auto-deny) ---- */
var APPROVAL_TIMEOUT_MS = 120000;
function stampReq(req) {
  req.received = Date.now();
  req.receivedStr = nowTime();
  req.deadline = req.received + APPROVAL_TIMEOUT_MS;
  return req;
}
function fmtRemaining(ms) {
  var s = Math.max(0, Math.ceil(ms / 1000));
  var sec = String(s % 60);
  if (sec.length < 2) sec = '0' + sec;
  return Math.floor(s / 60) + ':' + sec;
}
function timeoutDeny(req) {
  store.queue = store.queue.filter(function (r) { return r !== req; });
  if (store.notifFor === req) store.notifFor = null;
  // an OS authentication sheet raised for this request is void once it auto-denies
  if (store.osPrompt && store.osPrompt.req === req) store.osPrompt = null;
  if (!store.queue.length) { store.approvalOpen = false; store.alwaysOpen = false; }
  store.reqDetailOpen = null;
  store.revokeInheritedRules = false;
  audit('⏱', 'Auto-denied (approval timeout): ' + req.agent, req.action);
  toast('⏱ Request auto-denied — no decision within 120 s');
  termResolveWait();
  if (req.onDecide) req.onDecide(false, 'approval_timeout');
  renderAppSafe();
}
setInterval(function () {
  if (!store.queue.length) return;
  var now = Date.now();
  var expired = store.queue.filter(function (r) { return r.deadline && r.deadline <= now; });
  if (expired.length) { expired.forEach(timeoutDeny); return; }
  var el = document.getElementById('ap-countdown');
  if (el && store.queue[0].deadline) {
    el.textContent = fmtRemaining(store.queue[0].deadline - now);
  }
}, 1000);

// Returns 'wait' if the runner must pause for a human decision,
// undefined if a saved rule auto-approved it.
function brokerCall(req) {
  audit('📨', req.agent + ' requested ' + req.connection, req.action);
  if (findRule(req.agent, req.connection)) {
    audit('⚡', 'Auto-approved: ' + req.agent + ' → ' + req.connection);
    toast('⚡ Auto-approved');
    termResult('auto-approved by your standing rule (' + req.agent + ' → ' + req.connection + ')');
    req.onDecide(true);
    return;
  }
  termWait('Running… waiting for your approval in AgentMFA (🔐 in the menu bar, times out in 120 s)');
  enqueue(req);
  return 'wait';
}

function decide(allowed) {
  var req = store.queue.shift();
  if (!req) return;
  store.alwaysOpen = false;
  store.reqDetailOpen = null;                       // next request re-applies its by-method default
  if (store.notifFor === req) store.notifFor = null;
  if (!store.queue.length) store.approvalOpen = false;
  if (allowed && req.kind === 'pair' && store.revokeInheritedRules) {
    var before = store.rules.length;
    store.rules = store.rules.filter(function (r) { return r.agent !== req.agent; });
    var removed = before - store.rules.length;
    if (removed) audit('🗑', 'Prior standing permissions revoked: ' + req.agent,
      removed + ' auto-allow rule' + (removed === 1 ? '' : 's') + ' removed');
  }
  store.revokeInheritedRules = false;
  audit(allowed ? '✅' : '⛔', (allowed ? 'Allowed once' : 'Denied') + ': ' + req.agent, req.action);
  renderApp();
  termResolveWait();
  if (req.onDecide) req.onDecide(allowed, allowed ? null : 'denied_by_user');
  else toast(allowed ? '✅ Allowed once' : '⛔ Request denied');
}

function saveRuleAndAllow() {
  var req = store.queue[0];
  if (!req) return;
  var conn = findConn(req.connection);
  if (conn && !findRule(req.agent, req.connection)) {
    store.rules.push({ agent: req.agent, connectionId: conn.id, created: nowTime() });
  }
  store.alwaysOpen = false;
  audit('📜', 'Auto-allow saved: ' + req.agent + ' → ' + req.connection);
  toast('📜 Auto-allow saved — future matching requests approve automatically');
  decide(true);
}

/* ============================================================
   scenarios — each one is a realistic Claude Code turn: the user
   prompt lands in the transcript, Claude narrates, and every broker
   exchange is a ● Bash(curl …) call against the Unix socket
   ============================================================ */
function abortScenario() {
  runner.i = runner.steps.length;
  runner.silentFinish = false;
  runner.finished = true;
  store.running = false;
}
function resumeRunner() {
  if (!store.waiting) return;
  store.waiting = false;
  updateControls();
  if (store.running) scheduleNext(500);
  else updateControls();
}

function buildDeploy() {
  var body = { event_type: 'deploy', client_payload: { ref: 'main', environment: 'production' } };
  var headers = { Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' };
  return [
    function () {
      termClaude('A production deploy is a write, so AgentMFA will show you the exact request body and ask for OS authentication before it signs and sends it. I’m including a request_id so a retried call can’t double-fire the deploy.');
    },
    function () {
      termTool(CURL + ' -H "Authorization: Bearer $AGENTMFA_TOKEN" http://localhost/v1/http -d \'{"connection":"github","method":"POST","path":"/repos/aka/aka/dispatches","request_id":"req_5d2f8a1c4b9e","body":{"event_type":"deploy","client_payload":{"ref":"main","environment":"production"}}}\'');
      return brokerCall({
        kind: 'http',
        agent: 'claude-code',
        connection: 'github',
        method: 'POST',
        path: '/repos/aka/aka/dispatches',
        reqHeaders: headers,
        reqBody: body,
        action: 'POST api.github.com/repos/aka/aka/dispatches',
        notifBody: 'claude-code wants to use github — POST /repos/aka/aka/dispatches',
        onDecide: function (allowed, reason) {
          if (allowed) {
            termResult('204 No Content');
          } else {
            termResult('403 Forbidden — {"reason":"' + (reason || 'denied_by_user') + '"}');
            termClaude(reason === 'approval_timeout'
              ? 'The dispatch approval timed out before you decided — nothing was deployed. Retryable whenever you’re ready.'
              : 'Understood — you denied the dispatch, so no deploy was triggered.');
            abortScenario();
          }
          resumeRunner();
        }
      });
    },
    function () {
      termClaude('Deploy triggered — repository_dispatch "deploy" sent to aka/aka for ref main → environment production. The workflow should appear in the Actions tab momentarily; your GitHub token never left the broker.');
    }
  ];
}

  var btn = e.target.closest('[data-act]');
  // dismiss the desktop settings popover on any click outside it (its own
  // toggle handles itself; menu-item clicks close it in their handlers)
  if (store.settingsMenuOpen && !e.target.closest('.settings-menu') &&
      !(btn && btn.dataset.act === 'toggle-settings-menu')) {
    store.settingsMenuOpen = false;
    if (!btn) { renderApp(); return; }
  }
  if (!btn) {
    // clicking elsewhere on the desktop blurs the tray dropdown (DESIGN.md §2:
    // hidden on blur) — tray mode only (a regular window doesn't blur-close),
    // and never through the OS confirmation sheet
    if (store.windowMode === 'tray' && store.trayOpen && !store.osPrompt && e.target.closest('#desktop') && !e.target.closest('#dropdown')) {
      store.trayOpen = false;
      store.reveal = {};
      renderApp();
    }
    return;
  }
  var act = btn.dataset.act;
  var name = btn.dataset.name;
  switch (act) {
    case 'toggle-tray':
      if (store.windowMode === 'desktop') {
        // the main window is already open; the tray icon stays the
        // guaranteed entry point to pending approvals (§2/§6)
        if (store.queue.length) store.approvalOpen = true;
        renderApp();
        break;
      }
      store.trayOpen = !store.trayOpen;
      if (!store.trayOpen) store.reveal = {};
      if (store.trayOpen && store.queue.length) store.approvalOpen = true;  // tray = guaranteed entry point
      renderApp();
      break;
    case 'toggle-mode':
      // one frontend, two chromes (§2) — the mockup shows one at a time
      store.windowMode = store.windowMode === 'tray' ? 'desktop' : 'tray';
      store.trayOpen = store.windowMode === 'tray';
      store.reveal = {};
      renderApp();
      break;
    case 'tab':
      store.tab = btn.dataset.tab;
      store.confirmDelete = null;
      store.confirmDeleteConn = null;
      renderApp();
      break;
    case 'reveal':
      store.reveal[name] = true;
      // the prefix is fetched by an audited core-side Keychain read (§2/§9)
      audit('👁', 'Secret prefix revealed: ' + name);
      renderApp();
      break;
    case 'hide':
      store.reveal[name] = false;
      renderApp();
      break;
    case 'copy':
      var sec = store.secrets.filter(function (s) { return s.name === name; })[0];
      // core-side copy applies clipboard hygiene (DESIGN.md §9): the pasteboard
      // item is marked org.nspasteboard.ConcealedType, auto-cleared after 30 s,
      // and an audit entry records that a secret was copied (never its value)
      if (sec && navigator.clipboard) navigator.clipboard.writeText(sec.value).catch(function () {});
      audit('📋', 'Secret value copied: ' + name + ' (concealed; auto-clears in 30 s)');
      toast('📋 Copied — concealed, auto-clears in 30 s');
      flashCopied(name);
      break;
    case 'del-ask':
      if (usedBy(name).length) {
        store.confirmDelete = name;
        renderApp();
      } else {
        requireOSConfirm('Delete secret “' + name + '”',
          function () { deleteSecret(name); });
      }
      break;
    case 'del-yes':
      deleteSecret(name);
      break;
    case 'del-no':
      store.confirmDelete = null;
      renderApp();
      break;
    case 'del-conn-ask':
      requireOSConfirm('Delete connection “' + name + '”',
        function () { deleteConnection(name); });
      break;
    case 'del-conn-yes':
      deleteConnection(name);
      break;
    case 'del-conn-no':
      store.confirmDeleteConn = null;
      renderApp();
      break;
    case 'open-add-secret':
      store.addSecretOpen = true;
      store.draft = {};
      renderApp();
      break;
    case 'add-secret-cancel':
      store.addSecretOpen = false;
      store.draft = {};
      renderApp();
      break;
    case 'add-secret-save':
      saveSecret();
      break;
    case 'edit-secret':
      store.editSecret = name;
      store.draft = { secretValue: EDIT_SECRET_MASK };
      renderApp();
      selectEditSecretMask();
      break;
    case 'edit-secret-cancel':
      store.editSecret = null;
      store.draft = {};
      renderApp();
      break;
    case 'edit-secret-save':
      saveSecretEdit();
      break;
    case 'edit-conn': {
      var ec = findConn(name);
      if (!ec) break;
      store.editConn = name;
      store.connType = ec.type;   // fixed after creation — the seg is inert in edit mode
      store.connNewSecret = false;
      // prefill the Add form; templateDirty keeps the stored template from
      // being regenerated over by the default
      store.draft = {
        connName: ec.name,
        connSecrets: ec.secrets.slice(),
        connMulti: ec.multi !== false,
        host: ec.meta.host, port: ec.meta.port, db: ec.meta.dbname,
        user: ec.meta.user, sslmode: ec.meta.sslmode, url: ec.meta.url,
        template: ec.meta.template, templateDirty: !!ec.meta.template
      };
      renderApp();
      break;
    }
    case 'open-add-conn':
      store.addConnOpen = true;
      store.connType = 'api';
      store.connNewSecret = false;
      store.draft = {};
      renderApp();
      break;
    case 'conn-type':
      captureSheetDrafts();
      store.connType = btn.dataset.type;
      // pg/ssh/ws bind a single secret — drop any extra composed secrets on switch
      if (store.connType !== 'api' && store.draft.connSecrets) {
        store.draft.connSecrets = store.draft.connSecrets.slice(0, 1);
      }
      renderApp();
      break;
    case 'conn-secret-add': {
      captureSheetDrafts();
      var cs = store.draft.connSecrets || [(store.secrets[0] && store.secrets[0].name) || '__new__'];
      var unused = store.secrets.map(function (s) { return s.name; })
        .filter(function (n) { return cs.indexOf(n) === -1; });
      cs.push(unused[0] || store.secrets[0].name);
      store.draft.connSecrets = cs;
      renderApp();
      break;
    }
    case 'conn-secret-remove':
      captureSheetDrafts();
      store.draft.connSecrets.splice(Number(btn.dataset.idx), 1);
      renderApp();
      break;
    case 'add-conn-cancel':
      store.addConnOpen = false;
      store.editConn = null;
      store.connNewSecret = false;
      store.draft = {};
      renderApp();
      break;
    case 'add-conn-save':
      saveConnection();
      break;
    case 'toggle-settings-menu':
      store.settingsMenuOpen = !store.settingsMenuOpen;
      renderApp();
      break;
    case 'to-menubar':
      // the desktop settings menu's top item drops the app back to the menu bar
      store.settingsMenuOpen = false;
      store.windowMode = 'tray';
      store.trayOpen = true;
      store.reveal = {};
      renderApp();
      break;
    case 'open-settings':
      store.settingsMenuOpen = false;
      store.settingsOpen = true;
      store.syncConfirm = false;
      renderApp();
      break;
    case 'settings-close':
      store.settingsOpen = false;
      store.syncConfirm = false;
      store.draft = {};
      renderApp();
      break;
    case 'toggle-sync':
      // migrating every Keychain item is not a casual flip — always confirm first;
      // clicking the switch again while the confirmation is up cancels it
      store.syncConfirm = store.syncConfirm ? false : (store.settings.sync ? 'off' : 'on');
      renderApp();
      break;
    case 'sync-confirm-yes':
      if (store.syncConfirm === 'off') {
        store.settings.sync = false;
        audit('💳', 'iCloud Keychain sync turned off', 'Migrated ' + store.secrets.length + ' secrets · synced copies removed from other Macs');
        toast('💳 Sync off — secrets now exist only on this Mac');
      } else {
        var droppedReauth = store.settings.reauth;
        store.settings.reauth = false;
        store.settings.sync = true;
        audit('💳', 'iCloud Keychain sync turned on',
          (droppedReauth ? 'OS authentication requirement removed · migrated ' : 'Migrated ') + store.secrets.length + ' secrets');
        toast(droppedReauth ? '💳 Sync on — OS authentication requirement removed' : '💳 Sync on — secrets will appear on your other Macs');
      }
      store.syncConfirm = false;
      renderApp();
      break;
    case 'sync-confirm-no':
      store.syncConfirm = false;
      renderApp();
      break;
    case 'toggle-reauth':
      store.settings.reauth = !store.settings.reauth;
      audit('💳', store.settings.reauth
        ? 'OS authentication requirement enabled'
        : 'OS authentication requirement disabled');
      toast(store.settings.reauth ? '💳 OS authentication required to read secrets' : '💳 OS authentication requirement removed');
      renderApp();
      break;
    case 'save-pg-ca-bundle':
      captureSheetDrafts();
      store.settings.pgCaBundlePath = (store.draft.pgCaBundlePath || '').trim();
      audit('⚙️', store.settings.pgCaBundlePath
        ? 'Postgres trusted CA bundle saved'
        : 'Postgres trusted CA bundle cleared');
      toast(store.settings.pgCaBundlePath ? '🔐 Postgres CA bundle saved' : '🔐 Postgres CA bundle cleared');
      renderApp();
      break;
    case 'clear-pg-ca-bundle':
      store.settings.pgCaBundlePath = '';
      store.draft.pgCaBundlePath = '';
      audit('⚙️', 'Postgres trusted CA bundle cleared');
      toast('🔐 Postgres CA bundle cleared');
      renderApp();
      break;
    case 'open-approval':
      if (!store.queue.length) break;
      store.approvalOpen = true;
      store.notifFor = null;
      if (notifTimer) { clearTimeout(notifTimer); notifTimer = null; }
      renderApp();
      break;
    case 'decide-allow': {
      var reqA = store.queue[0];
      // pairing and mutating-request approvals are high-consequence — the
      // webview alone cannot complete them (DESIGN.md §6/§8). Deny is one click.
      if (reqA && (reqA.kind === 'pair' || (reqA.kind === 'http' && isMutating(reqA.method)))) {
        requireOSConfirm(
          reqA.kind === 'pair'
            ? 'Approve pairing of “' + reqA.agent + '”'
            : 'Allow ' + reqA.action,
          function () { if (store.queue[0] === reqA) decide(true); }, reqA);
      } else {
        decide(true);
      }
      break;
    }
    case 'decide-deny':
      decide(false);
      break;
    case 'toggle-always':
      store.alwaysOpen = !store.alwaysOpen;
      renderApp();
      break;
    case 'toggle-inherited-revoke':
      store.revokeInheritedRules = !!btn.checked;
      renderApp();
      break;
    case 'toggle-req-detail': {
      var cur = store.queue[0];
      var shownNow = store.reqDetailOpen === null ? isMutating(cur && cur.method) : store.reqDetailOpen;
      store.reqDetailOpen = !shownNow;              // user override for this request
      renderApp();
      break;
    }
    case 'save-rule': {
      var reqR = store.queue[0];
      if (!reqR) break;
      // a standing rule grants promptless access — always OS-confirmed (§8)
      requireOSConfirm('Save standing rule: always allow ' + reqR.agent + ' → ' + reqR.connection,
        function () { if (store.queue[0] === reqR) saveRuleAndAllow(); }, reqR);
      break;
    }
    case 'del-rule':
      store.rules.splice(Number(btn.dataset.idx), 1);
      audit('🗑', 'Auto-allow removed');
      renderApp();
      break;
    case 'revoke':
      revokePairing(name);
      break;
    case 'os-confirm': {
      var osp = store.osPrompt;
      store.osPrompt = null;
      if (osp && osp.onConfirm) osp.onConfirm();
      else renderApp();
      break;
    }
    case 'os-cancel':
      store.osPrompt = null;
      toast('🔒 OS authentication canceled — nothing changed');
      renderApp();
      break;
    case 'close-session':
      var askSid = Number(btn.dataset.id);
      closeSessionById(askSid);
      break;
    case 'scenario':
      selectScenario(btn.dataset.key);
      break;
    case 'step':
      stepOnce();
      break;
    case 'run':
      runAll();
      break;
    case 'reset':
      resetAgent();
      break;
    case 'state':
      applyState(btn.dataset.state);
      break;
  }
});
document.addEventListener('change', function (e) {
  if (e.target && /^c-secret-\d+$/.test(e.target.id)) {
    captureSheetDrafts();
    store.connNewSecret = !!(store.draft.connSecrets && store.draft.connSecrets[0] === '__new__');
    renderApp();
  }
});
document.addEventListener('input', function (e) {
  if (!e.target) return;
  if (e.target.id === 'f-name' || e.target.id === 'f-cname') e.target.classList.remove('err');
  if (store.editSecret && e.target.id === 'f-value') store.draft.valueInvalid = false;
  if (e.target.id === 'c-template') store.draft.templateDirty = true;  // stop regenerating the default
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    if (store.settingsMenuOpen) {
      store.settingsMenuOpen = false; renderApp();
    } else if (store.osPrompt) {
      store.osPrompt = null; toast('🔒 OS authentication canceled — nothing changed'); renderApp();
    } else if (store.settingsOpen) {
      store.settingsOpen = false; store.syncConfirm = false; renderApp();
    } else if (store.addSecretOpen) {
      store.addSecretOpen = false; store.draft = {}; renderApp();
    } else if (store.editSecret) {
      store.editSecret = null; store.draft = {}; renderApp();
    } else if (store.addConnOpen || store.editConn) {
      store.addConnOpen = false; store.editConn = null; store.connNewSecret = false; store.draft = {}; renderApp();
    } else if (store.alwaysOpen) {
      store.alwaysOpen = false; renderApp();
    }
  } else if (e.key === 'Enter' && e.target && e.target.tagName === 'INPUT') {
    if (store.addSecretOpen) { e.preventDefault(); saveSecret(); }
    else if (store.editSecret) { e.preventDefault(); saveSecretEdit(); }
    else if (store.addConnOpen || store.editConn) { e.preventDefault(); saveConnection(); }
  }
});

/* ============================================================
   menu-bar clock + init
   ============================================================ */
function tickClock() {
  var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var mons = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var d = new Date();
  var h = d.getHours();
  var ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  var m = String(d.getMinutes());
  if (m.length < 2) m = '0' + m;
  document.getElementById('menu-clock').textContent =
    days[d.getDay()] + ' ' + mons[d.getMonth()] + ' ' + d.getDate() + ' ' + h + ':' + m + ' ' + ampm;
}
setInterval(tickClock, 1000);
tickClock();
renderAll();
</script>
</body>
