<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source for tray.png. macOS renders the PNG as a template image, so only
  this shape's alpha channel is significant. Keep transparent padding around
  the lock so the status item remains legible in both menu-bar appearances.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <circle cx="12" cy="16" r="1" fill="#000"/>
  <rect x="3" y="10" width="18" height="12" rx="2" fill="none" stroke="#000" stroke-width="2"/>
  <path d="M7 10V7a5 5 0 0 1 10 0v3" fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
</svg>
