# Standalone crate (own lockfile): not part of ../Cargo.toml's workspace, so
# the core/CLI stay buildable on any platform without the webview toolchain.
[workspace]

[package]
name = "aka-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A secrets manager for humans and agents."
# Deliberately NOT a member of the ../Cargo.toml workspace: this crate only
# builds where the platform webview toolchain exists (macOS; Linux needs
# webkit2gtk). The core + CLI crates build and test everywhere.

[lib]
name = "aka_desktop_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aka-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aka-api = { path = "../crates/aka-api" }
aka-client = { path = "../crates/aka-client" }
aka-core = { path = "../crates/aka-core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
# The plugin's desktop API intentionally discards interaction handles.
# Request notifications need the underlying handle so a click can open the
# Inbox; keep the plugin for its webview permissions/API.
notify-rust = { version = "4.18", features = ["preview-macos-un"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"
glob = "0.3"
shell-words = "1"
url = "2"
# "encryption" so a passphrase-protected identity file can be decrypted once,
# at import, instead of being refused (the vault seals the cleartext form).
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519", "rsa", "ecdsa", "encryption"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "0.3"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGSession"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSAlert", "NSApplication", "NSButton", "NSCell", "NSControl", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSView", "NSWindow"] }
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError"] }
block2 = "0.6"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }

[features]
dev-verbose = []

[dev-dependencies]
tempfile = "3"
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519", "rsa", "ecdsa", "encryption", "getrandom"] }
