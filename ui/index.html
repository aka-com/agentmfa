<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentMFA</title>
  <!-- Blocking on purpose: stamps data-theme on <html> before the first
       paint so the loading placeholder never flashes the wrong ground. -->
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/vendor/tippy.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- The chrome (main window / tray dropdown) is chosen from
       location.hash by app.tsx, so all Tauri windows share one file. -->
  <div id="root">
    <!-- Placeholder until app.tsx mounts the React root. Without
         it the first paint is a blank white webview for a beat — most visible
         in dev, where Vite transpiles each module on demand. -->
    <div class="app-loading" role="status" aria-label="Loading AgentMFA">
      <span class="app-loading-spinner"></span>
    </div>
  </div>
  <!-- Portal target for fixed-position overlays (the credential listbox),
       kept outside #root so React's tree and positioned DOM never mix. -->
  <div id="overlays"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
  <!-- Tooltip library (Tippy.js on Popper, self-hosted for the 'self'-only
       CSP). Popper must load first — it defines window.Popper, which Tippy
       consumes; Tippy then exposes window.tippy for app.tsx. -->
  <script src="/vendor/popper.min.js"></script>
  <script src="/vendor/tippy.umd.min.js"></script>
  <script src="/app.tsx" type="module"></script>
</body>
</html>
