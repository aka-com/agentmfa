[package]
name = "aka-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Multitool broker core: secret store, policy, approvals, audit, and the agent-facing daemon"

[features]
test-harness = []

[dependencies]
aka-api = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
percent-encoding = { workspace = true }
dirs = { workspace = true }
tempfile = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
tracing = { workspace = true }

tokio = { workspace = true }
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
tower = { workspace = true }
url = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }

postgres-protocol = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
webpki-roots = { workspace = true }
md-5 = { workspace = true }
chacha20poly1305 = { workspace = true }

ssh-key = { workspace = true }
rsa = { workspace = true }
signature = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Security.framework directly, rather than the `keyring` crate: only the raw
# SecItem API exposes `kSecUseDataProtectionKeychain`, which is what keeps
# Keychain reads from putting an ACL dialog in front of the user. The
# OSX_10_15 feature is what gates that constant in the -sys crate.
core-foundation = "0.10"
core-foundation-sys = "0.8"
security-framework-sys = { version = "2.17", features = ["OSX_10_15"] }

[dev-dependencies]
tempfile = { workspace = true }
libc = { workspace = true }
tokio-postgres = { workspace = true }
# The Postgres TLS tests need a private CA, a leaf it signed, and a leaf it
# did not, so they can assert what each `sslmode` accepts and refuses. The
# rustls pair is already a normal dependency; integration tests link their own.
rcgen = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
# Paused-clock tests for deadline/liveness timers.
tokio = { workspace = true, features = ["test-util"] }
# Test-only key generation for the SSH agent tests (OsRng via ssh-key's
# re-exported rand_core).
ssh-key = { workspace = true, features = ["getrandom"] }
